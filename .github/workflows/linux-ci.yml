name: Linux CI

# Core, the remote control API and kanban-code-server build and pass their
# tests on Linux, where the headless master runs.

on:
  pull_request:
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - ".github/workflows/linux-ci.yml"
  push:
    branches: [main]
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - ".github/workflows/linux-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: swift:6.2-noble
      options: --cap-add=SYS_PTRACE
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # tmux + git let the real-tmux / real-git tests run for real, python3
      # runs the stand-in CLIs some tests write; gdb and procps print the
      # threads of a hung run.
      - name: Install tools
        run: apt-get update && apt-get install -y tmux git python3 gdb procps

      - name: Build
        run: swift build --build-tests

      # Serial: on a four-core runner, tests in parallel starve the
      # cooperative pool long enough to trip the vault's approval timeouts.
      # The suite takes about two minutes. A run still going after ten has hung:
      # list the processes and print every thread of the test process, then
      # fail. The full output is uploaded as the test-log artifact.
      - name: Test
        run: |
          swift test --skip-build --no-parallel > test.log 2>&1 &
          pid=$!
          for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 5; done
          if kill -0 $pid 2>/dev/null; then
            echo "still running after ten minutes"
            ps -eo pid,ppid,etime,stat,args > processes.txt
            for p in $(awk '/xctest|swiftpm-testing-helper/ && !/awk/ {print $1}' processes.txt); do
              echo "=== threads of $p" >> threads.txt
              gdb -p $p -batch -ex 'thread apply all bt 25' >> threads.txt 2>&1
            done
            kill $pid
            status=1
          else
            wait $pid && status=0 || status=$?
          fi
          grep -E "recorded an issue|Test run with" test.log | tail -100
          exit $status

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-log
          path: |
            test.log
            processes.txt
            threads.txt
          if-no-files-found: ignore

      - name: Build kanban-code-server (release)
        run: swift build -c release --product kanban-code-server --static-swift-stdlib
