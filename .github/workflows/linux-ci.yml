name: Linux CI

# Core, the remote control API and kanban-code-server build and pass their
# tests on Linux, where the headless master runs.

on:
  pull_request:
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - ".github/workflows/linux-ci.yml"
  push:
    branches: [main]
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - ".github/workflows/linux-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # tmux + git let the real-tmux / real-git tests run for real.
      - name: Install tmux
        run: apt-get update && apt-get install -y tmux git gdb

      - name: Build
        run: swift build --build-tests

      # The suite takes about a minute. A run still going after ten has hung:
      # print every thread of the test process, then fail.
      - name: Test
        run: |
          swift test --skip-build &
          pid=$!
          for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 5; done
          if kill -0 $pid 2>/dev/null; then
            for p in $(pgrep -f 'PackageTests.xctest'); do
              echo "=== threads of $p"
              gdb -p $p -batch -ex 'thread apply all bt 25' 2>&1 | grep -E '^Thread|^#' | head -3000
            done
            kill $pid
            exit 1
          fi
          wait $pid

      - name: Build kanban-code-server (release)
        run: swift build -c release --product kanban-code-server --static-swift-stdlib
