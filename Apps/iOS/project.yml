name: KanbanCodeMobile
options:
  bundleIdPrefix: io.kanbancode
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  KanbanCode:
    path: ../..
  SwiftTerm:
    path: ../../LocalPackages/SwiftTerm
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KanbanCodeMobile:
    type: application
    platform: iOS
    sources:
      - KanbanCodeMobile
    dependencies:
      - package: KanbanCode
        product: KanbanCodeRemoteKit
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        # A free personal team cannot use the paid team's App ID:
        # Scripts/ios-device-refresh.sh builds those with KC_BUNDLE_ID_SUFFIX=.dev.
        KC_BUNDLE_ID_SUFFIX: ""
        PRODUCT_BUNDLE_IDENTIFIER: io.kanbancode.mobile$(KC_BUNDLE_ID_SUFFIX)
        PRODUCT_NAME: KanbanCodeMobile
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: KanbanCodeMobile/Info.plist
      configs:
        # Push needs the App ID's Push Notifications capability; Debug installs
        # from Xcode (make ios-device) stay without it.
        Release:
          CODE_SIGN_ENTITLEMENTS: KanbanCodeMobile/KanbanCodeMobile.entitlements
    info:
      path: KanbanCodeMobile/Info.plist
      properties:
        CFBundleDisplayName: Kanban Code
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSFaceIDUsageDescription: Confirm it is you before approving a request from an agent.
        NSCameraUsageDescription: Scan the pairing QR code shown by Kanban Code on your Mac, and take photos to send to a session.
        NSLocalNetworkUsageDescription: Connect to Kanban Code on your Mac.
        NSMicrophoneUsageDescription: Dictate messages to your agents. Speech is turned into text on this device.
        NSSpeechRecognitionUsageDescription: Dictate messages to your agents. Speech is turned into text on this device.
        CFBundleURLTypes:
          - CFBundleURLName: io.kanbancode.mobile
            CFBundleURLSchemes:
              - kanbancode
  KanbanCodeMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KanbanCodeMobileTests
    dependencies:
      - target: KanbanCodeMobile
      - package: KanbanCode
        product: KanbanCodeRemoteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.kanbancode.mobile.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/KanbanCodeMobile.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/KanbanCodeMobile
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
  KanbanCodeMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - KanbanCodeMobileUITests
    dependencies:
      - target: KanbanCodeMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.kanbancode.mobile.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: KanbanCodeMobile
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  KanbanCodeMobile:
    build:
      targets:
        KanbanCodeMobile: all
        KanbanCodeMobileTests: [test]
        KanbanCodeMobileUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KanbanCodeMobileTests
        - KanbanCodeMobileUITests
